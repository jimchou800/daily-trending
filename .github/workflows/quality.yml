name: quality

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: black --check daily_trending tests scripts
      - run: ruff check daily_trending tests scripts
      - run: python -m daily_trending.quality
      - run: python -m coverage run --branch -m daily_trending.quality --run-tests
      - run: python -m coverage json -o coverage.json
      - run: python scripts/check_coverage.py
      - name: Preserve auditable coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: production-coverage
          path: coverage.json
          if-no-files-found: error
